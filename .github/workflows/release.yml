name: Build and release binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset: gammaos-pico-tool-linux-x86_64
            bin: gammaos-pico-tool
          - os: windows-latest
            asset: gammaos-pico-tool-windows-x86_64.exe
            bin: gammaos-pico-tool.exe
          - os: macos-15-intel
            asset: gammaos-pico-tool-macos-x86_64
            bin: gammaos-pico-tool
          - os: macos-15
            asset: gammaos-pico-tool-macos-arm64
            bin: gammaos-pico-tool
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip pyinstaller pytest
          python -m pip install .

      - name: Tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb p7zip-full zip
          xvfb-run -a python -m pytest -q

      - name: Network tests
        if: runner.os != 'Linux'
        run: python -m pytest -q tests/test_net.py

      - name: Bake in built-in ScreenScraper credentials
        shell: bash
        env:
          SS_DEVCREDS_GEN: ${{ secrets.SS_DEVCREDS_GEN }}
        run: |
          if [ -n "$SS_DEVCREDS_GEN" ]; then
            python -c "import base64,os; open('pico_tool/scrape/_devcreds_gen.py','wb').write(base64.b64decode(os.environ['SS_DEVCREDS_GEN']))"
            python -c "from pico_tool.scrape._devcreds import builtin_credentials as b; import sys; sys.exit(0 if b() else 1)" \
              || { echo "SS_DEVCREDS_GEN does not hold a usable credentials module"; exit 1; }
            echo "baked built-in ScreenScraper credentials into the build"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "SS_DEVCREDS_GEN is missing: a release build must have the built-in ScreenScraper access"
            exit 1
          else
            echo "no SS_DEVCREDS_GEN secret; building without built-in credentials (TheGamesDB with a user key still works)"
          fi

      - name: Build one-file binary
        shell: bash
        run: |
          extra=()
          if [ -f pico_tool/scrape/_devcreds_gen.py ]; then
            extra+=(--hidden-import pico_tool.scrape._devcreds_gen)
          fi
          pyinstaller --onefile --name gammaos-pico-tool --clean --noconfirm \
            --paths . \
            --hidden-import tkinter \
            --hidden-import PIL --hidden-import PIL.ImageTk --hidden-import PIL._tkinter_finder \
            --hidden-import usb.backend.libusb1 \
            --hidden-import libusb_package \
            --hidden-import importlib_resources \
            --collect-binaries libusb_package \
            --hidden-import truststore --collect-submodules truststore \
            --hidden-import certifi --collect-data certifi \
            --collect-submodules pico_tool \
            "${extra[@]}" \
            packaging/entry.py

      # The person's computer does not have the CA paths this build machine's Python was compiled
      # with. Pointing SSL_CERT_FILE and SSL_CERT_DIR at nothing recreates that here: the built binary
      # must still reach GitHub over a checked HTTPS connection, or the build fails.
      - name: Check HTTPS from the built binary
        shell: bash
        env:
          SSL_CERT_FILE: ${{ runner.temp }}/no-such-ca-file.pem
          SSL_CERT_DIR: ${{ runner.temp }}/no-such-ca-dir
        run: |
          "dist/${{ matrix.bin }}" check-network | tee network.txt
          if [ -f pico_tool/scrape/_devcreds_gen.py ] && ! grep -q -e "(built-in access)" -e "has its built-in access" network.txt; then
            echo "the built binary does not have its built-in ScreenScraper access"
            exit 1
          fi
          mkdir -p empty-card
          "dist/${{ matrix.bin }}" status empty-card | tee status.txt
          grep -q "^Latest:" status.txt
          if grep -qi -e "certificate" -e "SSL" status.txt; then
            echo "the release check failed on a certificate problem"
            exit 1
          fi

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p out
          cp "dist/${{ matrix.bin }}" "out/${{ matrix.asset }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}

      - name: Ensure release exists
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # Create the release from the tag if it does not exist yet, so a bare
        # `git push origin vX.Y.Z` works without a separate `gh release create`.
        # The `|| true` swallows the race where a sibling matrix job creates it
        # in the same instant.
        run: |
          gh release view "${GITHUB_REF_NAME}" \
            || gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes \
            || true

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" "out/${{ matrix.asset }}" --clobber
